<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/styles/reset.css" />
         <link rel="stylesheet" href="/styles/tokens.css" />
        <link rel="stylesheet" href="/styles/page.css" />
    </head>
    <body class = "parent">
        <script type="module">
          import { define, Auth } from "@calpoly/mustang";
          import HeaderElement from "/src/header";

          define({
            "gd-header": HeaderElement,
            "mu-auth": Auth.Provider
          });

          HeaderElement.initializeOnce();
        </script>

    <mu-auth provides="thegarden:auth">
          <gd-header>
            <a slot="brand" href="index.html">
              <h1>
                <svg class="icon-logo">
                  <use href="/icons/garden.svg#icon-garden-love" />
                </svg>
                The Garden
              </h1>
            </a>
            <section slot="content" class="Couple">
                <a href="couple.html">
                    <h2>
                        <svg class="icon-inline">
                            <use href="/icons/heart.svg#icon-heart" />
                        </svg>
                        Couple
                    </h2>
                </a>
            </section>
          </gd-header>
        </mu-auth>
        <script>
          // Get the current token from localStorage (if any)
          function getStoredToken() {
            try {
              return localStorage.getItem('thegarden:token');
            } catch (e) {
              return null;
            }
          }

          // Check if we have a stored token and update auth state on load
          const token = getStoredToken();
          if (token) {
            // Dispatch signin event with stored token so Auth provider picks it up
            const signinEvent = new CustomEvent('auth:message', {
              bubbles: true,
              composed: true,
              detail: ['auth/signin', { token }]
            });
            document.dispatchEvent(signinEvent);
            window.top?.dispatchEvent(signinEvent);
          }

          // Listen for login/logout events
          window.addEventListener('auth:message', async (evt) => {
            const [action, detail] = evt.detail || [];
            if (action === 'auth/signin' && detail?.token) {
              console.log('Auth message received: signin with token');
              // After signin, fetch the current user info
              try {
                const res = await fetch('/api/users/me', {
                  headers: { 'Authorization': `Bearer ${detail.token}` }
                });
                if (res.ok) {
                  const userInfo = await res.json();
                  console.log('User info fetched:', userInfo);
                  // Dispatch another auth:message to update the provider with full user info
                  const updateEvent = new CustomEvent('auth:message', {
                    bubbles: true,
                    composed: true,
                    detail: ['auth/signin', { ...detail, ...userInfo }]
                  });
                  document.dispatchEvent(updateEvent);
                  window.top?.dispatchEvent(updateEvent);
                }
              } catch (err) {
                console.error('Failed to fetch user info:', err);
              }
            }
          });
        </script>
        <h2>Garden</h2>
            <section class="Garden">  
            <ul>
                <li>
                    <a href="memories.html">Flowers</a>
                </li>
            </ul>
        </section>
        <script>
          // Hide the header when embedded (iframe with ?embed=1) and rewrite internal links
          try {
            const params = new URLSearchParams(window.location.search);
            if (params.get('embed') === '1') {
              const hdr = document.querySelector('gd-header') || document.querySelector('header');
              if (hdr) hdr.style.display = 'none';
              document.body.style.marginTop = '0';

              const anchors = Array.from(document.querySelectorAll('a[href]'));
              anchors.forEach((a) => {
                try {
                  const href = a.getAttribute('href') || '';
                  if (/\.html($|\?)/.test(href) && !/^https?:\/\//.test(href)) {
                    const url = new URL(href, window.location.href);
                    url.searchParams.set('embed', '1');
                    a.setAttribute('href', url.pathname + url.search + url.hash);
                  }
                } catch (e) {}
              });
            }
          } catch (e) {}
        </script>
    </body>
    <footer>
        <label>
            <select id="color-mode-toggle">
                <option value="default">Default Mode</option>
                <option value="pink">Pink Mode</option>
                <option value="blue">Blue Mode</option>
                <option value="dark">Dark Mode</option>
            </select>
            Color Mode
        </label>
        </footer>
    <script src="/js_files/colormode.js"></script>
</html>
