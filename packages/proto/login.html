<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito:ital,wght@0,200..1000;1,200..1000&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles/reset.css" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/page.css" />
  <script type="module">
    import { define, Auth } from "@calpoly/mustang";
    import { LoginFormElement } from "/src/auth/login-form";

    define({
      "mu-auth": Auth.Provider,
      "login-form": LoginFormElement
    });
  </script>
</head>
<body class="page">
  <mu-auth>
    <h2>User Login</h2>
      <main class="card">
        <login-form api="/auth/login">
          <label>
            <span>Username:</span>
            <input name="username" autocomplete="off" />
          </label>
          <label>
            <span>Password:</span>
            <input type="password" name="password" />
          </label>
          <button id="login-fallback" type="button">Sign In</button>
        </login-form>
      </main>
      <p>
        Or did you want to
        <a href="newuser.html">Sign up as a new user</a>?
      </p>
      <p>
        Or <a href="/app">browse as a guest</a>
      </p>
    </mu-auth>
  <script>
    // Fallback submit handler: collects inputs and POSTs JSON to /auth/login
    (function () {
      const btn = document.getElementById('login-fallback');
      if (!btn) return;
      btn.addEventListener('click', async () => {
        const usernameEl = document.querySelector('input[name="username"]');
        const passwordEl = document.querySelector('input[name="password"]');
        const username = usernameEl ? usernameEl.value : '';
        const password = passwordEl ? passwordEl.value : '';

        try {
          const res = await fetch('/auth/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ username, password })
          });
          if (!res.ok) {
            const body = await res.text();
            alert('Login failed: ' + res.status + '\n' + body);
            return;
          }
          const json = await res.json();
          // Dispatch a simple storage update and redirect if token provided
          if (json.token) {
            // store token in localStorage for the SPA/provider to pick up
            localStorage.setItem('thegarden:token', json.token);
            // notify Mustang auth provider via the same auth:message event
            const evt = new CustomEvent('auth:message', {
              bubbles: true,
              composed: true,
              detail: ['auth/signin', { token: json.token, redirect: '/app' }]
            });
            // dispatch the event in several scopes so the provider picks it up
            try { window.dispatchEvent(evt); } catch (e) {}
            try { window.document?.dispatchEvent(evt); } catch (e) {}
            try { if (window.top && window.top !== window) window.top.dispatchEvent(evt); } catch (e) {}
            try { if (window.top && window.top.document) window.top.document.dispatchEvent(evt); } catch (e) {}
            // follow redirect (server may include one later) — default to the SPA
            const redirect = (json.redirect) ? json.redirect : '/app';
            location.href = redirect;
          } else {
            alert('Login succeeded but no token returned');
          }
        } catch (err) {
          alert('Login error: ' + err);
        }
      });
    })();
  </script>
  </body>
</html>
